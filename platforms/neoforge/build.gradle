plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.146'
}
apply from: rootProject.file('gradle/platform-common.gradle')
apply from: rootProject.file('gradle/verification-launch.gradle')
def candidate = providers.gradleProperty('compatibilityJar').map { file(it) }
	.getOrElse(tasks.jar.archiveFile.get().asFile)
def compatibilityMods = providers.gradleProperty('compatibilityMods').map { directory ->
	fileTree(directory).matching { include '*.jar' }.files
}.getOrElse([])
def thirdPartyOnly = providers.gradleProperty('thirdPartyOnly').map { it.toBoolean() }.getOrElse(false)
def nativeInputCheck = providers.gradleProperty('nativeInputCheck').map { it.toBoolean() }.getOrElse(false)
if (nativeInputCheck && (!providers.gradleProperty('compatibilityJar').isPresent() || !compatibilityMods.isEmpty() || thirdPartyOnly)) {
	throw new GradleException('Native input check requires one explicit candidate without optional mods or an isolated control')
}
neoForge {
	enable {
		version = project.neo_version
		// Match CI's binary pipeline; source generation is optional for local debugging.
		disableRecompilation = !providers.gradleProperty('minecraftSources').map { it.toBoolean() }.getOrElse(false)
	}
	addModdingDependenciesTo sourceSets.verification
	mods {
		hangul { sourceSet sourceSets.main }
		hangul_verification { sourceSet sourceSets.verification }
	}
	runs {
		client {
			client()
			loadedMods = [mods.hangul]
			gameDirectory = layout.buildDirectory.dir('run-client').get().asFile
		}
		verification {
			client()
			sourceSet = sourceSets.verification
			loadedMods = [mods.hangul_verification]
			gameDirectory = layout.buildDirectory.dir(nativeInputCheck ? 'run-native-input' : 'run-verification').get().asFile
			systemProperty 'java.awt.headless', (!nativeInputCheck).toString()
			systemProperty 'hangul.verification.nativeInputCheck', nativeInputCheck.toString()
			systemProperty 'mixin.debug.countInjections', 'true'
			systemProperty 'hangul.verification.jar', candidate.absolutePath
			if (!compatibilityMods.isEmpty()) {
				systemProperty 'hangul.verification.rei', 'true'
				systemProperty 'hangul.verification.imblocker', providers.gradleProperty('withIMBlocker').getOrElse('false')
				systemProperty 'hangul.verification.thirdPartyOnly', thirdPartyOnly.toString()
			}
		}
	}
}
dependencies {
	if (!thirdPartyOnly) verificationRuntimeOnly files(candidate)
	verificationRuntimeOnly files(compatibilityMods)
}
tasks.named('runVerification') {
	if (!providers.gradleProperty('compatibilityJar').isPresent()) { dependsOn jar }
	if (!nativeInputCheck) configureVerificationLaunch(it)
}
tasks.named('check') { dependsOn 'runVerification' }
