plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.fabric_mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.quiltmc.org/repository/release/' }
	maven { url = 'https://maven.shedaniel.me/' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hangul" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Keep annotation bytecode compatible with the minimum supported Loader.
	compileOnly "net.fabricmc:fabric-loader:${project.loader_api_version}"
	runtimeOnly "net.fabricmc:fabric-loader:${project.loader_version}"
	// Type signatures for the optional REI adapter; never bundled or required at runtime.
	clientCompileOnly('me.shedaniel.cloth:basic-math:0.6.1') { transitive = false }
}

// Loom derives compiler libraries from the minimum Loader API. Resolve the
// selected runtime's own installer metadata as well, so tests never accidentally
// run a new Loader with the old compiler's Mixin/MixinExtras implementations.
configurations {
	loaderRuntimeMetadata {
		canBeConsumed = false
		transitive = false
	}
}
dependencies {
	loaderRuntimeMetadata "net.fabricmc:fabric-loader:${project.loader_version}"
}
def loaderInstaller = zipTree(configurations.loaderRuntimeMetadata.singleFile)
	.matching { include 'fabric-installer.json' }.singleFile
def loaderLibraries = new groovy.json.JsonSlurper().parse(loaderInstaller).libraries
dependencies {
	(loaderLibraries.common + loaderLibraries.development).each { library ->
		runtimeOnly library.name
	}
}

// Verification tools are separate from the shipped mod and its source archive.
sourceSets {
	verification {
		compileClasspath += sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.runtimeClasspath - sourceSets.main.output - sourceSets.client.output
	}
}

dependencies {
	verificationImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

def compatibilityJar = providers.gradleProperty('compatibilityJar')
	.map { file(it) }.orElse(tasks.named('jar').flatMap { it.archiveFile }.map { it.asFile })
def fixedVerificationFixture = providers.gradleProperty('verificationFixture').map { file(it) }
def verificationFixture = fixedVerificationFixture.orElse(providers.provider { tasks.verificationJar.archiveFile.get().asFile })
def isolatedVerificationClasspath = {
	def outputs = sourceSets.main.output.files + sourceSets.client.output.files + sourceSets.verification.output.files
	files(sourceSets.verification.runtimeClasspath.files.findAll { !outputs.contains(it) }) + files(verificationFixture.get())
}

apply from: 'gradle/verification-receipt.gradle'

tasks.register('verifyBinaryCompatibility', JavaExec) {
	group = 'verification'
	description = 'Checks the exact candidate JAR against Minecraft descriptors and Mixin targets.'
	if (!fixedVerificationFixture.isPresent()) dependsOn 'verificationJar'
	if (!providers.gradleProperty('compatibilityJar').isPresent()) {
		dependsOn jar
	}
	classpath = files()
	mainClass = 'kr.playcity.hangul.verification.BinaryCompatibilityCheck'
	doFirst {
		classpath = isolatedVerificationClasspath()
		args compatibilityJar.get().absolutePath, loom.minecraftProvider.minecraftClientJar.absolutePath
	}
}

tasks.register('verificationJar', Jar) {
	archiveClassifier = 'verification'
	from sourceSets.verification.output
	destinationDirectory = layout.buildDirectory.dir('verification')
}

tasks.register('stageCompatibilityJar', Copy) {
	dependsOn build, 'stageVerificationFixture'
	from(tasks.named('jar').flatMap { it.archiveFile })
	into layout.buildDirectory.dir('compatibility')
	rename { 'hangul.jar' }
}

tasks.register('stageVerificationFixture', Copy) {
	dependsOn verificationJar
	from tasks.named('verificationJar').flatMap { it.archiveFile }
	into layout.buildDirectory.dir('compatibility')
	rename { 'verification.jar' }
}

tasks.register('verifyMixinApplication', JavaExec) {
	timeout = java.time.Duration.ofMinutes(3)
	group = 'verification'
	description = 'Applies every candidate Mixin through Fabric Loader without starting a game window.'
	dependsOn verifyBinaryCompatibility
	if (!fixedVerificationFixture.isPresent()) dependsOn verificationJar
	classpath = files()
	mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
	systemProperty 'fabric.development', 'true'
	systemProperty 'fabric.side', 'client'
	systemProperty 'fabric.noGui', 'true'
	systemProperty 'fabric.debug.throwDirectly', 'true'
	systemProperty 'mixin.debug.countInjections', 'true'
	systemProperty 'java.awt.headless', 'true'
	def runPath = layout.buildDirectory.dir("verification/run-${project.minecraft_version}")
	configureVerificationReceipt(it, runPath.map { it.file('result.txt') }, compatibilityJar)
	doFirst {
		classpath = isolatedVerificationClasspath()
		def runDirectory = runPath.get().asFile
		runDirectory.mkdirs()
		workingDir runDirectory
		systemProperty 'fabric.addMods', compatibilityJar.get().absolutePath + File.pathSeparator + verificationFixture.get().absolutePath
		systemProperty 'hangul.verification.jar', compatibilityJar.get().absolutePath
		if (providers.gradleProperty('compatibilityMods').isPresent()) {
			def mods = fileTree(providers.gradleProperty('compatibilityMods').get()).matching { include '*.jar' }.files
			if (mods.isEmpty()) throw new GradleException('Compatibility profile contains no mod JARs')
			classpath += files(mods)
			boolean thirdPartyOnly = providers.gradleProperty('thirdPartyOnly').map { it.toBoolean() }.getOrElse(false)
			systemProperty 'fabric.addMods',
				((thirdPartyOnly ? [verificationFixture.get()] : [compatibilityJar.get(), verificationFixture.get()]) + mods)
					.collect { it.absolutePath }.join(File.pathSeparator)
			systemProperty 'hangul.verification.rei', 'true'
			systemProperty 'hangul.verification.imblocker', providers.gradleProperty('withIMBlocker').getOrElse('false')
			systemProperty 'hangul.verification.thirdPartyOnly', thirdPartyOnly.toString()
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('verifyHangulComposer', JavaExec) {
	group = 'verification'
	description = 'Runs the dependency-free Dubeolsik composition checks.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'kr.playcity.hangul.HangulComposerTest'
}

test {
	failOnNoDiscoveredTests = false
}

check.dependsOn verifyHangulComposer, verifyMixinApplication

jar {
	archiveClassifier = 'fabric'
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

apply from: 'gradle/quilt-verification.gradle'

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
