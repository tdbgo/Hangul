name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      fabric-matrix: ${{ steps.matrix.outputs.fabric }}
      platform-matrix: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and verify stable candidate
        run: ./gradlew clean stageCompatibilityJar --no-daemon
      - name: Read declared compatibility matrix
        id: matrix
        run: python3 scripts/verification-matrix.py --github-output
      - name: Share exact candidate with compatibility jobs
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-candidate
          path: build/compatibility/*.jar
          if-no-files-found: error
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verified-fabric
          path: build/libs/
          if-no-files-found: error

  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.fabric-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-candidate
          path: candidate
      - name: Verify candidate binary and apply all Mixins
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew verifyMixinApplication --no-daemon -PcompatibilityJar=candidate/hangul.jar -PverificationFixture=candidate/verification.jar -Pminecraft_version=${{ matrix.minecraft }} -Ploader_version=${{ matrix.loader }}
          if [ "${{ matrix.quilt }}" = "true" ]; then
            ./gradlew verifyQuiltApplication --no-daemon -PcompatibilityJar=candidate/hangul.jar -PverificationFixture=candidate/verification.jar -Pminecraft_version=${{ matrix.minecraft }}
          fi

  platform-build:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform: [neoforge, forge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build and verify platform candidate
        shell: pwsh
        run: ./gradlew.bat -Pplatform=${{ matrix.platform }} :${{ matrix.platform }}:clean :${{ matrix.platform }}:build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/
          if-no-files-found: error
  platform-compatibility:
    needs: [build, platform-build]
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.platform-matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: verified-${{ matrix.platform }}
          path: candidate
      - name: Verify immutable candidate on each exact loader for this game
        shell: pwsh
        env:
          TARGETS_JSON: ${{ toJSON(matrix.targets) }}
        run: |
          $platform = '${{ matrix.platform }}'
          $targets = $env:TARGETS_JSON | ConvertFrom-Json
          $candidate = (Get-ChildItem "candidate/*-$platform.jar").FullName
          $hash = (Get-FileHash $candidate).Hash
          $property = if ($platform -eq 'neoforge') { 'neo_version' } else { 'forge_version' }
          $task = if ($platform -eq 'neoforge') { 'runVerification' } else { 'runVerificationClient' }
          foreach ($target in $targets) {
            & ./gradlew.bat "-Pplatform=$platform" ":${platform}:$task" "-P${property}=$($target.loader)" "-PcompatibilityJar=$candidate" --no-daemon
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash $candidate).Hash -ne $hash) { throw 'Candidate changed' }
          }

  optional-widget-compatibility:
    needs: [build, platform-build]
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: fabric-26.2, platform: fabric}
          - {profile: fabric-26.3, platform: fabric}
          - {profile: neoforge-26.3, platform: neoforge}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: verified-${{ matrix.platform }}
          path: candidate
      - name: Check pinned REI widget and isolate IMBlocker incompatibility
        shell: pwsh
        run: |
          $candidate = (Get-ChildItem 'candidate/*-${{ matrix.platform }}.jar').FullName
          python scripts/verify-mod-compatibility.py '${{ matrix.profile }}' --candidate $candidate --check-imblocker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture optional-mod diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optional-diagnostics-${{ matrix.profile }}
          path: .toolchains/checks/*.log
          if-no-files-found: warn

  artifact-gate:
    needs: [build, compatibility, platform-build, platform-compatibility, optional-widget-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: verified-*
      - name: Check platform packaging and shared classes
        run: python3 scripts/verify-artifacts.py verified-fabric/*-fabric.jar verified-neoforge/*-neoforge.jar verified-forge/*-forge.jar
      - name: Check release scope regression tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -O -m unittest discover -s scripts -p 'test_*.py'
