name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      minecraft-versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and verify stable candidate
        run: ./gradlew clean stageCompatibilityJar --no-daemon
      - name: Read declared compatibility matrix
        id: matrix
        run: |
          node -e 'const fs = require("node:fs"); const mod = JSON.parse(fs.readFileSync("src/main/resources/fabric.mod.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "versions=" + JSON.stringify(mod.custom["hangul:tested_game_versions"]) + "\n");'
      - name: Share exact candidate with compatibility jobs
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-candidate
          path: build/compatibility/hangul.jar
          if-no-files-found: error
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: build/libs/
          if-no-files-found: error

  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.build.outputs.minecraft-versions) }}
        os: [ubuntu-24.04]
        loader: ['0.19.5']
        include:
          - {minecraft: '26.1', os: windows-2025, loader: '0.19.5'}
          - {minecraft: '26.2', os: windows-2025, loader: '0.19.5'}
          - {minecraft: '26.3-pre-2', os: windows-2025, loader: '0.19.5'}
          - {minecraft: '26.2', os: ubuntu-24.04, loader: '0.19.3'}
          - {minecraft: '26.1', os: ubuntu-24.04, loader: '0.19.3'}
          - {minecraft: '26.3-pre-2', os: ubuntu-24.04, loader: '0.19.3'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v8
        with:
          name: compatibility-candidate
          path: candidate
      - name: Verify candidate binary and apply all Mixins
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew verifyMixinApplication --no-daemon -PcompatibilityJar=candidate/hangul.jar -Pminecraft_version=${{ matrix.minecraft }} -Ploader_version=${{ matrix.loader }}
          if [ "${{ matrix.loader }}" = "0.19.5" ]; then
            ./gradlew verifyQuiltApplication --no-daemon -PcompatibilityJar=candidate/hangul.jar -Pminecraft_version=${{ matrix.minecraft }}
          fi

  platform-build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [neoforge, forge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build and verify platform candidate
        shell: pwsh
        run: ./gradlew.bat -Pplatform=${{ matrix.platform }} :${{ matrix.platform }}:clean :${{ matrix.platform }}:build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: platforms/${{ matrix.platform }}/build/libs/
          if-no-files-found: error
      - name: Verify same candidate against declared loader versions
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $targets = (Get-Content platform-matrix.json -Raw | ConvertFrom-Json).$platform
          $candidate = (Get-ChildItem "platforms/$platform/build/libs/*-$platform.jar").FullName
          $hash = (Get-FileHash $candidate).Hash
          $property = if ($platform -eq 'neoforge') { 'neo_version' } else { 'forge_version' }
          $task = if ($platform -eq 'neoforge') { 'runVerification' } else { 'runVerificationClient' }
          foreach ($target in $targets) {
            & ./gradlew.bat "-Pplatform=$platform" ":${platform}:$task" "-P${property}=$($target.loader)" "-PcompatibilityJar=$candidate" --no-daemon
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash $candidate).Hash -ne $hash) { throw 'Candidate changed' }
          }

  artifact-gate:
    needs: [build, platform-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
      - name: Check platform packaging and shared classes
        run: python3 scripts/verify-artifacts.py release-artifacts/*-fabric.jar release-neoforge/*-neoforge.jar release-forge/*-forge.jar
